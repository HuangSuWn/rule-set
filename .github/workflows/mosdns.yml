name: Update Rules

on:
  push:
    paths:
      - 'mosdns.txt'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests==2.28.1
          if [ $? -ne 0 ]; then
            echo "Failed to install dependencies"
            exit 1
          fi

      - name: Process rules
        run: |
          rm -rf mosdns/*.txt
          python - <<EOF
          import os
          import requests
          from collections import OrderedDict, defaultdict
          from pathlib import Path

          mosdns_dir = Path("mosdns")
          mosdns_dir.mkdir(exist_ok=True)

          rules_by_name = defaultdict(list)
          try:
              with open('mosdns.txt', 'r') as f:
                  for line in f:
                      stripped_line = line.strip()
                      if not stripped_line:
                          continue
                      try:
                          name, url = stripped_line.split(' ', 1)
                          rules_by_name[name].append(url)
                      except ValueError:
                          print(f"Invalid line format in mosdns.txt: {stripped_line}")
                          continue
          except FileNotFoundError:
              print("Error: mosdns.txt not found")
              exit(1)

          PREFERRED_PREFIXES = {'domain:', 'full:', 'keyword:', 'regexp:'}

          for name, urls in rules_by_name.items():
              # 创建两个文件：一个用于域名规则，一个用于IP规则
              domain_output_file = mosdns_dir / f"{name}.txt"
              ip_output_file = mosdns_dir / f"{name}_ip.txt"
              
              domain_rules_dict = {}
              ip_rules_dict = {}
              ipv6_rules_dict = {}

              for i, url in enumerate(urls):
                  try:
                      response = requests.get(url, timeout=15)
                      response.raise_for_status()
                      content = response.text
                  except requests.RequestException as e:
                      print(f"Failed to fetch {url}: {e}")
                      content = ""

                  for line in content.splitlines():
                      stripped_line = line.strip()
                      if not stripped_line or stripped_line.startswith('#'):
                          continue
                      
                      # 处理 IP-CIDR 规则
                      if 'IP-CIDR,' in stripped_line:
                          # 删除 "IP-CIDR," 前缀，保留剩余部分
                          ip_rule = stripped_line.replace('IP-CIDR,', '').strip()
                          if ip_rule:
                              ip_rules_dict[ip_rule] = ip_rule
                          continue
                      
                      # 处理 IP-CIDR6 规则
                      if 'IP-CIDR6,' in stripped_line:
                          # 删除 "IP-CIDR6," 前缀，保留剩余部分
                          ipv6_rule = stripped_line.replace('IP-CIDR6,', '').strip()
                          if ipv6_rule:
                              ipv6_rules_dict[ipv6_rule] = ipv6_rule
                          continue
                      
                      # 处理域名规则（原有逻辑）
                      modified_line = stripped_line.replace('DOMAIN-SUFFIX,', 'domain:') \
                                                  .replace('DOMAIN,', 'full:') \
                                                  .replace('DOMAIN-KEYWORD,', 'keyword:') \
                                                  .replace('DOMAIN-REGEX,', 'regexp:') \
                                                  .strip()
                      if not modified_line:
                          continue

                      core_content = modified_line
                      for prefix in PREFERRED_PREFIXES:
                          if modified_line.startswith(prefix):
                              core_content = modified_line[len(prefix):].strip()
                              break

                      if core_content in domain_rules_dict:
                          existing_rule = domain_rules_dict[core_content]
                          if any(existing_rule.startswith(p) for p in PREFERRED_PREFIXES):
                              continue
                          if any(modified_line.startswith(p) for p in PREFERRED_PREFIXES):
                              domain_rules_dict[core_content] = modified_line
                          else:
                              domain_rules_dict[core_content] = modified_line
                      else:
                          domain_rules_dict[core_content] = modified_line

              # 保存域名规则文件
              try:
                  with open(domain_output_file, 'w') as outfile:
                      for rule_line in domain_rules_dict.values():
                          outfile.write(rule_line + '\n')
                  print(f"Updated {domain_output_file} with {len(domain_rules_dict)} domain rules")
              except IOError as e:
                  print(f"Failed to write to {domain_output_file}: {e}")
              
              # 保存IP规则文件（IPv4和IPv6合并）
              try:
                  if ip_rules_dict or ipv6_rules_dict:
                      with open(ip_output_file, 'w') as outfile:
                          # 先写入IPv4规则
                          for rule_line in ip_rules_dict.values():
                              outfile.write(rule_line + '\n')
                          # 再写入IPv6规则
                          for rule_line in ipv6_rules_dict.values():
                              outfile.write(rule_line + '\n')
                      print(f"Updated {ip_output_file} with {len(ip_rules_dict)} IPv4 rules and {len(ipv6_rules_dict)} IPv6 rules")
                  else:
                      # 如果没有IP规则，删除可能存在的空文件
                      if ip_output_file.exists():
                          ip_output_file.unlink()
              except IOError as e:
                  print(f"Failed to write to {ip_output_file}: {e}")
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mosdns/*.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "Update rules from mosdns.txt - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            if [ $? -ne 0 ]; then
              echo "Failed to push changes"
              exit 1
            fi
          fi
