name: Update Rules

on:
  push:
    paths:
      - 'mosdns.txt'
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests==2.28.1
          if [ $? -ne 0 ]; then
            echo "Failed to install dependencies"
            exit 1
          fi

      - name: Process rules
        run: |
          rm -rf mosdns/*.txt
          python - <<EOF
          import os
          import re
          import requests
          import ipaddress
          from collections import defaultdict
          from pathlib import Path

          mosdns_dir = Path("mosdns")
          mosdns_dir.mkdir(exist_ok=True)

          rules_by_name = defaultdict(list)
          try:
              with open('mosdns.txt', 'r') as f:
                  for line in f:
                      stripped_line = line.strip()
                      if not stripped_line:
                          continue
                      try:
                          name, url = stripped_line.split(' ', 1)
                          rules_by_name[name].append(url)
                      except ValueError:
                          print(f"Invalid line format in mosdns.txt: {stripped_line}")
                          continue
          except FileNotFoundError:
              print("Error: mosdns.txt not found")
              exit(1)

          PREFERRED_PREFIXES = {'domain:', 'full:', 'keyword:', 'regexp:'}

          # IP 正则
          ipv4_re = re.compile(r'^(\d{1,3}\.){3}\d{1,3}$')
          ipv4_cidr_re = re.compile(r'^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$')
          ipv6_re = re.compile(r'^[0-9a-fA-F:]+$')
          ipv6_cidr_re = re.compile(r'^[0-9a-fA-F:]+/\d{1,3}$')

          # 安全排序函数
          def sort_ip_rules(ipv4_dict, ipv6_dict):
              ipv4_list = []
              ipv6_list = []

              # IPv4 排序
              for ip in ipv4_dict.values():
                  try:
                      net = ipaddress.ip_network(ip, strict=False)
                      if isinstance(net, ipaddress.IPv4Network):
                          ipv4_list.append(net)
                      else:
                          ipv6_list.append(net)
                  except ValueError:
                      continue
              ipv4_list.sort()

              # IPv6 排序
              for ip in ipv6_dict.values():
                  try:
                      net = ipaddress.ip_network(ip, strict=False)
                      if isinstance(net, ipaddress.IPv6Network):
                          ipv6_list.append(net)
                      else:
                          ipv4_list.append(net)
                  except ValueError:
                      continue
              ipv6_list.sort()

              return [str(ip) for ip in ipv4_list], [str(ip) for ip in ipv6_list]

          for name, urls in rules_by_name.items():
              domain_output_file = mosdns_dir / f"{name}.txt"
              ip_output_file = mosdns_dir / f"{name}_ip.txt"

              domain_rules_dict = {}
              ip_rules_dict = {}
              ipv6_rules_dict = {}

              for url in urls:
                  try:
                      response = requests.get(url, timeout=15)
                      response.raise_for_status()
                      content = response.text
                  except requests.RequestException as e:
                      print(f"Failed to fetch {url}: {e}")
                      content = ""

                  for line in content.splitlines():
                      stripped_line = line.strip()
                      if not stripped_line or stripped_line.startswith('#'):
                          continue

                      if 'PROCESS-NAME,' in stripped_line:
                          print(f"Skipping PROCESS-NAME rule: {stripped_line}")
                          continue

                      # IP-CIDR / IP-CIDR6
                      if stripped_line.startswith('IP-CIDR,'):
                          parts = stripped_line.split(',', 2)
                          if len(parts) >= 2:
                              cidr = parts[1].strip()
                              ip_rules_dict[cidr] = cidr
                          continue
                      if stripped_line.startswith('IP-CIDR6,'):
                          parts = stripped_line.split(',', 2)
                          if len(parts) >= 2:
                              cidr6 = parts[1].strip()
                              ipv6_rules_dict[cidr6] = cidr6
                          continue

                      # 裸 IP / CIDR
                      if ipv4_re.match(stripped_line) or ipv4_cidr_re.match(stripped_line):
                          ip_rules_dict[stripped_line] = stripped_line
                          continue
                      if ipv6_re.match(stripped_line) or ipv6_cidr_re.match(stripped_line):
                          ipv6_rules_dict[stripped_line] = stripped_line
                          continue

                      # 域名规则
                      modified_line = stripped_line.replace('DOMAIN-SUFFIX,', 'domain:') \
                                                  .replace('DOMAIN,', 'full:') \
                                                  .replace('DOMAIN-KEYWORD,', 'keyword:') \
                                                  .replace('DOMAIN-REGEX,', 'regexp:') \
                                                  .strip()
                      if not modified_line:
                          continue

                      core_content = modified_line
                      for prefix in PREFERRED_PREFIXES:
                          if modified_line.startswith(prefix):
                              core_content = modified_line[len(prefix):].strip()
                              break

                      if core_content in domain_rules_dict:
                          existing_rule = domain_rules_dict[core_content]
                          if any(existing_rule.startswith(p) for p in PREFERRED_PREFIXES):
                              continue
                          if any(modified_line.startswith(p) for p in PREFERRED_PREFIXES):
                              domain_rules_dict[core_content] = modified_line
                          else:
                              domain_rules_dict[core_content] = modified_line
                      else:
                          domain_rules_dict[core_content] = modified_line

              # 保存域名规则
              try:
                  with open(domain_output_file, 'w') as outfile:
                      for rule_line in domain_rules_dict.values():
                          outfile.write(rule_line + '\n')
                  print(f"Updated {domain_output_file} with {len(domain_rules_dict)} domain rules")
              except IOError as e:
                  print(f"Failed to write to {domain_output_file}: {e}")

              # 保存 IP 规则（排序 + IPv4 → IPv6）
              try:
                  if ip_rules_dict or ipv6_rules_dict:
                      sorted_ipv4, sorted_ipv6 = sort_ip_rules(ip_rules_dict, ipv6_rules_dict)
                      with open(ip_output_file, 'w') as outfile:
                          for ip in sorted_ipv4:
                              outfile.write(ip + '\n')
                          for ip in sorted_ipv6:
                              outfile.write(ip + '\n')
                      print(f"Updated {ip_output_file} with {len(sorted_ipv4)} IPv4 and {len(sorted_ipv6)} IPv6 rules")
                  else:
                      if ip_output_file.exists():
                          ip_output_file.unlink()
              except IOError as e:
                  print(f"Failed to write to {ip_output_file}: {e}")
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mosdns/*.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "Update rules from mosdns.txt - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            if [ $? -ne 0 ]; then
              echo "Failed to push changes"
              exit 1
            fi
          fi
